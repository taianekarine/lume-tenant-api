services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lume_tenant}
      POSTGRES_USER: ${POSTGRES_USER:-lume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - lume_tenant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lume} -d ${POSTGRES_DB:-lume_tenant}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: build
    command: ["npm", "run", "prisma:deploy"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  storage-init:
    build:
      context: .
      target: production
    user: '0:0'
    command:
      [
        "sh",
        "-ec",
        "mkdir -p /app/var/whatsapp-media /app/var/imports/whatsapp && chown -R node:node /app/var/whatsapp-media /app/var/imports/whatsapp",
      ]
    restart: "no"
    volumes:
      - lume_tenant_whatsapp_media:/app/var/whatsapp-media
      - lume_tenant_whatsapp_imports:/app/var/imports/whatsapp

  api:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      JWT_REFRESH_REMEMBER_TTL_DAYS: ${JWT_REFRESH_REMEMBER_TTL_DAYS:-30}
      INSTALLATION_ID: ${INSTALLATION_ID:?defina INSTALLATION_ID}
      LICENSE_PUBLIC_KEY_BASE64: ${LICENSE_PUBLIC_KEY_BASE64:?defina LICENSE_PUBLIC_KEY_BASE64}
      LICENSE_DOCUMENT: ${LICENSE_DOCUMENT:?defina LICENSE_DOCUMENT}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      PASSWORD_CHANGE_TOKEN_TTL_MINUTES: 30
      PASSWORD_HISTORY_LIMIT: ${PASSWORD_HISTORY_LIMIT:-10}
      PASSWORD_RESET_URL_BASE: ${PASSWORD_RESET_URL_BASE:?defina PASSWORD_RESET_URL_BASE}
      PASSWORD_RESET_MIN_RESPONSE_MS: ${PASSWORD_RESET_MIN_RESPONSE_MS:-750}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:?defina RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?defina RESEND_FROM_EMAIL}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Lume}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      RESEND_REQUEST_TIMEOUT_MS: ${RESEND_REQUEST_TIMEOUT_MS:-10000}
      RESEND_MAX_ATTEMPTS: ${RESEND_MAX_ATTEMPTS:-2}
      RESEND_RETRY_DELAY_MS: ${RESEND_RETRY_DELAY_MS:-150}
      CORS_ORIGINS: ${CORS_ORIGINS:?defina CORS_ORIGINS}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_CHANNEL_ID: ${WHATSAPP_CHANNEL_ID:?defina WHATSAPP_CHANNEL_ID}
      WHATSAPP_CHANNEL_NAME: ${WHATSAPP_CHANNEL_NAME:-WhatsApp principal}
      WHATSAPP_PHONE_NUMBER: ${WHATSAPP_PHONE_NUMBER:?defina WHATSAPP_PHONE_NUMBER}
      WHATSAPP_IGNORE_GROUPS: ${WHATSAPP_IGNORE_GROUPS:-true}
      WHATSAPP_IGNORE_FROM_ME: ${WHATSAPP_IGNORE_FROM_ME:-true}
      WHATSAPP_MAX_WEBHOOK_BYTES: ${WHATSAPP_MAX_WEBHOOK_BYTES:-262144}
      WHATSAPP_MAX_ATTACHMENT_BYTES: ${WHATSAPP_MAX_ATTACHMENT_BYTES:-10485760}
      WHATSAPP_PANEL_MAX_ATTACHMENT_BYTES: ${WHATSAPP_PANEL_MAX_ATTACHMENT_BYTES:-104857600}
      WHATSAPP_ALLOWED_MIME_TYPES: ${WHATSAPP_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain,text/csv,text/vcard,text/x-vcard,application/octet-stream,audio/ogg,audio/mpeg,audio/mp4,audio/aac,audio/wav,video/mp4,video/webm,video/quicktime}
      WHATSAPP_MEDIA_STORAGE_DRIVER: filesystem
      WHATSAPP_MEDIA_STORAGE_PATH: /app/var/whatsapp-media
      WHATSAPP_IMPORT_ROOT: /app/var/imports/whatsapp
      WHATSAPP_IMPORT_UPLOAD_TEMP_ROOT: /app/var/imports/whatsapp/incoming
      WHATSAPP_ANDROID_BACKUP_MAX_DECRYPTED_BYTES: ${WHATSAPP_ANDROID_BACKUP_MAX_DECRYPTED_BYTES:-4294967296}
      WHATSAPP_ANDROID_IMPORT_CHUNK_MESSAGES: ${WHATSAPP_ANDROID_IMPORT_CHUNK_MESSAGES:-10000}
      WHATSAPP_IMPORT_APPLY_CONCURRENCY: ${WHATSAPP_IMPORT_APPLY_CONCURRENCY:-4}
      WHATSAPP_ANDROID_MEDIA_MAX_FILE_BYTES: ${WHATSAPP_ANDROID_MEDIA_MAX_FILE_BYTES:-536870912}
      WHATSAPP_ANDROID_MEDIA_ARCHIVE_MAX_BYTES: ${WHATSAPP_ANDROID_MEDIA_ARCHIVE_MAX_BYTES:-8589934592}
      WHATSAPP_ANDROID_MEDIA_ARCHIVE_MAX_ENTRIES: ${WHATSAPP_ANDROID_MEDIA_ARCHIVE_MAX_ENTRIES:-250000}
      WHATSAPP_ANDROID_MEDIA_ARCHIVE_MAX_UNCOMPRESSED_BYTES:
        ${WHATSAPP_ANDROID_MEDIA_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-17179869184}
      WHATSAPP_ANDROID_MEDIA_ARCHIVE_CONCURRENCY: ${WHATSAPP_ANDROID_MEDIA_ARCHIVE_CONCURRENCY:-4}
      WHATSAPP_ANDROID_MEDIA_UPLOAD_CHUNK_BYTES: ${WHATSAPP_ANDROID_MEDIA_UPLOAD_CHUNK_BYTES:-16777216}
      WHATSAPP_HISTORY_IMPORT_MAX_ARCHIVES: ${WHATSAPP_HISTORY_IMPORT_MAX_ARCHIVES:-5000}
      WHATSAPP_HISTORY_IMPORT_MAX_ARCHIVE_BYTES: ${WHATSAPP_HISTORY_IMPORT_MAX_ARCHIVE_BYTES:-536870912}
      WHATSAPP_HISTORY_IMPORT_MAX_ENTRIES: ${WHATSAPP_HISTORY_IMPORT_MAX_ENTRIES:-5000}
      WHATSAPP_HISTORY_IMPORT_MAX_UNCOMPRESSED_BYTES: ${WHATSAPP_HISTORY_IMPORT_MAX_UNCOMPRESSED_BYTES:-2147483648}
      WHATSAPP_HISTORY_IMPORT_MAX_TEXT_BYTES: ${WHATSAPP_HISTORY_IMPORT_MAX_TEXT_BYTES:-134217728}
      WHATSAPP_HISTORY_IMPORT_RETENTION_HOURS: ${WHATSAPP_HISTORY_IMPORT_RETENTION_HOURS:-48}
      WHATSAPP_RETENTION_DAYS: ${WHATSAPP_RETENTION_DAYS:-365}
      WHATSAPP_FOLLOW_UP_INACTIVITY_MS: ${WHATSAPP_FOLLOW_UP_INACTIVITY_MS:-1800000}
      INTEGRATION_RETENTION_DAYS: ${INTEGRATION_RETENTION_DAYS:-90}
      RETENTION_JOB_ENABLED: ${RETENTION_JOB_ENABLED:-true}
      EVOLUTION_PROVIDER_NAME: ${EVOLUTION_PROVIDER_NAME:-Evolution API}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:?defina EVOLUTION_BASE_URL}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:?defina EVOLUTION_INSTANCE_NAME}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:?defina EVOLUTION_WEBHOOK_SECRET}
      EVOLUTION_SEND_TEXT_PAYLOAD_MODE: ${EVOLUTION_SEND_TEXT_PAYLOAD_MODE:-number-text}
      EVOLUTION_SEND_TEXT_TIMEOUT_MS: ${EVOLUTION_SEND_TEXT_TIMEOUT_MS:-10000}
      EVOLUTION_SEND_MEDIA_TIMEOUT_MS: ${EVOLUTION_SEND_MEDIA_TIMEOUT_MS:-30000}
      EVOLUTION_MEDIA_CONTENT_TIMEOUT_MS: ${EVOLUTION_MEDIA_CONTENT_TIMEOUT_MS:-30000}
      WEBHOOK_MAX_SKEW_MS: ${WEBHOOK_MAX_SKEW_MS:-300000}
      WEBHOOK_MAX_EVENT_AGE_MS: ${WEBHOOK_MAX_EVENT_AGE_MS:-604800000}
      EVOLUTION_DISPATCH_LEASE_MS: ${EVOLUTION_DISPATCH_LEASE_MS:-90000}
      WHATSAPP_API_DISPATCH_INTERVAL_MS: ${WHATSAPP_API_DISPATCH_INTERVAL_MS:-500}
      WHATSAPP_API_EXECUTION_TIMEOUT_MS: ${WHATSAPP_API_EXECUTION_TIMEOUT_MS:-480000}
      WHATSAPP_API_DISPATCH_BATCH_SIZE: ${WHATSAPP_API_DISPATCH_BATCH_SIZE:-20}
      WHATSAPP_API_RETRY_BASE_DELAY_MS: ${WHATSAPP_API_RETRY_BASE_DELAY_MS:-500}
      WHATSAPP_API_RETRY_MAX_DELAY_MS: ${WHATSAPP_API_RETRY_MAX_DELAY_MS:-300000}
      WHATSAPP_API_DEBOUNCE_MS: ${WHATSAPP_API_DEBOUNCE_MS:-2000}
      WHATSAPP_API_DEPARTMENT_COLLECTION_MS: ${WHATSAPP_API_DEPARTMENT_COLLECTION_MS:-120000}
      WHATSAPP_AI_PROVIDER_ORDER: ${WHATSAPP_AI_PROVIDER_ORDER:-openai,cerebras,gemini,groq}
      WHATSAPP_AI_REQUEST_TIMEOUT_MS: ${WHATSAPP_AI_REQUEST_TIMEOUT_MS:-90000}
      WHATSAPP_AI_OPENAI_API_KEY: ${WHATSAPP_AI_OPENAI_API_KEY:-}
      WHATSAPP_AI_OPENAI_BASE_URL: ${WHATSAPP_AI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      WHATSAPP_AI_OPENAI_MODEL: ${WHATSAPP_AI_OPENAI_MODEL:-gpt-5.5}
      WHATSAPP_AI_CEREBRAS_API_KEY: ${WHATSAPP_AI_CEREBRAS_API_KEY:-}
      WHATSAPP_AI_GEMINI_API_KEY: ${WHATSAPP_AI_GEMINI_API_KEY:-}
      WHATSAPP_AI_GROQ_API_KEY: ${WHATSAPP_AI_GROQ_API_KEY:-}
      MILENIUM_DIRECTOR_PHONE: ${MILENIUM_DIRECTOR_PHONE:?defina MILENIUM_DIRECTOR_PHONE}
      MILENIUM_DEPARTMENT_PURCHASES_PHONE: ${MILENIUM_DEPARTMENT_PURCHASES_PHONE:?defina MILENIUM_DEPARTMENT_PURCHASES_PHONE}
      MILENIUM_DEPARTMENT_CONTROLLING_PHONE: ${MILENIUM_DEPARTMENT_CONTROLLING_PHONE:?defina MILENIUM_DEPARTMENT_CONTROLLING_PHONE}
      MILENIUM_DEPARTMENT_DP_PHONE: ${MILENIUM_DEPARTMENT_DP_PHONE:?defina MILENIUM_DEPARTMENT_DP_PHONE}
      MILENIUM_DEPARTMENT_FINANCE_PHONE: ${MILENIUM_DEPARTMENT_FINANCE_PHONE:?defina MILENIUM_DEPARTMENT_FINANCE_PHONE}
      MILENIUM_DEPARTMENT_MANAGEMENT_PHONE: ${MILENIUM_DEPARTMENT_MANAGEMENT_PHONE:?defina MILENIUM_DEPARTMENT_MANAGEMENT_PHONE}
      MILENIUM_DEPARTMENT_MAINTENANCE_PHONE: ${MILENIUM_DEPARTMENT_MAINTENANCE_PHONE:?defina MILENIUM_DEPARTMENT_MAINTENANCE_PHONE}
      MILENIUM_DEPARTMENT_MONITORING_PHONE: ${MILENIUM_DEPARTMENT_MONITORING_PHONE:?defina MILENIUM_DEPARTMENT_MONITORING_PHONE}
      MILENIUM_DEPARTMENT_OPERATIONAL_PHONE: ${MILENIUM_DEPARTMENT_OPERATIONAL_PHONE:?defina MILENIUM_DEPARTMENT_OPERATIONAL_PHONE}
      TENANT_LEGAL_NAME: ${TENANT_LEGAL_NAME:-}
      TENANT_TRADE_NAME: ${TENANT_TRADE_NAME:-}
      TENANT_TAX_ID: ${TENANT_TAX_ID:-}
      TENANT_ADMIN_NAME: ${TENANT_ADMIN_NAME:-}
      TENANT_ADMIN_USERNAME: ${TENANT_ADMIN_USERNAME:-}
      TENANT_ADMIN_EMAIL: ${TENANT_ADMIN_EMAIL:-}
      TENANT_ADMIN_CPF: ${TENANT_ADMIN_CPF:-}
      TENANT_ADMIN_PASSWORD: ${TENANT_ADMIN_PASSWORD:-}
    ports:
      - "${PORT:-3333}:3333"
    volumes:
      - lume_tenant_whatsapp_media:/app/var/whatsapp-media
      - lume_tenant_whatsapp_imports:/app/var/imports/whatsapp
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3333/api/v1/health/ready",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  lume_tenant_postgres_data:
  lume_tenant_whatsapp_media:
  lume_tenant_whatsapp_imports:
